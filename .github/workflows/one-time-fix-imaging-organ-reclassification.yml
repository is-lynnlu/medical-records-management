name: One-time fix imaging organ reclassification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fix-imaging-organ-reclassification.yml'
permissions:
  contents: write
jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted rendering fix
        env:
          REPLACEMENT_B64: 
        run: |
          python - <<'PY'
          import base64
          import os
          import pathlib
          import re

          target = pathlib.Path("index.html")
          source = target.read_text(encoding="utf-8")
          replacement = base64.b64decode(os.environ["REPLACEMENT_B64"]).decode("utf-8")
          pattern = r"function imagingSectionKind\(value\).*?(?=\nfunction imagingReportHtml\(value,title\))"
          updated, count = re.subn(pattern, lambda _: replacement, source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f"Expected one imaging classifier block, replaced {count}")
          target.write_text(updated, encoding="utf-8")
          PY
      - name: Validate page scripts
        run: |
          node -e 'const fs=require("fs"),s=fs.readFileSync("index.html","utf8"),parts=[...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]); for(const p of parts)new Function(p); console.log("Validated "+parts.length+" inline scripts")'
      - name: Commit fix and remove temporary workflow
        run: |
          rm '.github/workflows/one-time-fix-imaging-organ-reclassification.yml'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html '.github/workflows/one-time-fix-imaging-organ-reclassification.yml'
          git commit -m "Fix organ-aware imaging report grouping"
          git push origin main
